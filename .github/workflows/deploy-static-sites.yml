# Publishes what the `distribute-docs` Cloudflare Pages project (docs.distribute.you)
# serves now that the docs live under the landing at distribute.you/docs
# (SITE-FOUNDATION-1029): no page, only a `_redirects` file that sends every
# docs.distribute.you URL to its twin under distribute.you/docs with ONE 301.
# The rules are generated from the landing's docs route list
# (apps/landing/scripts/docs-host-redirects.mjs), so a docs page added later
# redirects without an edit here.
#
# Requires two repository secrets. Without them the deploy step fails loudly
# rather than skipping, because a deploy that quietly does nothing looks exactly
# like a deploy that worked:
#   CLOUDFLARE_API_TOKEN   — a custom token with `Account / Cloudflare Pages / Edit`
#   CLOUDFLARE_ACCOUNT_ID  — 1132e5bee7f6bad001161cf13ca427b3
name: Deploy docs host redirects

on:
  push:
    branches: [main]
    paths:
      - "apps/landing/src/lib/docs/docs-routes.ts"
      - "apps/landing/scripts/docs-host-redirects.mjs"
      - ".github/workflows/deploy-static-sites.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the redirect bundle
        run: node apps/landing/scripts/docs-host-redirects.mjs docs-host-out

      # A bundle with no rule would publish an empty site over the redirects.
      - name: Verify the bundle
        run: |
          rules=$(grep -c ' 301$' docs-host-out/_redirects)
          echo "docs host: $rules redirect rules"
          if [ "$rules" -lt 40 ]; then
            echo "::error::docs-host-out/_redirects carries only $rules rules — refusing to publish"
            exit 1
          fi

      # Invoked through npx: wrangler-action runs `pnpm add wrangler` at the repo
      # root, which a pnpm workspace refuses. Pinned to the v3 major.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set — refusing to report a deploy that cannot happen"
            exit 1
          fi
          npx --yes wrangler@3 pages deploy docs-host-out \
            --project-name=distribute-docs \
            --branch=main
