    <script>
      // Password reset links carry a one-time token as a query parameter.
      // Strip it from the URL before any tracking script (Meta Pixel, gtag,
      // Clarity, ...) can read location.href, and hand it to the app through
      // sessionStorage. This must stay the first script on the page.
      (function () {
        if (window.location.pathname !== '/reset-password') return;
        try {
          var params = new URLSearchParams(window.location.search);
          var token = params.get('token');
          if (!token) return;
          window.sessionStorage.setItem('password_reset_token', token);
          params.delete('token');
          var query = params.toString();
          window.history.replaceState(null, '', window.location.pathname + (query ? '?' + query : '') + window.location.hash);
        } catch (e) {
          // If storage is unavailable the token stays in the URL and the
          // reset flow still works; a working flow beats a guaranteed scrub.
        }
      })();
    </script>
