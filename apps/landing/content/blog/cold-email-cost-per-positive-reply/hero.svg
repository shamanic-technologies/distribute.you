<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- SAFE ZONE: every word sits inside x 200..1400 (the central 4:3 of the 16:9 canvas). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1e3a8a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1380" cy="140" r="380" fill="url(#glow)"/>
  <circle cx="200" cy="800" r="300" fill="url(#glow)"/>

  <text x="800" y="150" font-size="24" letter-spacing="3" fill="#2563eb" font-weight="600" text-anchor="middle">COLD EMAIL DATA</text>
  <text x="800" y="238" font-size="68" font-weight="800" fill="#0f172a" text-anchor="middle">What does a positive reply</text>
  <text x="800" y="316" font-size="68" font-weight="800" fill="#0f172a" text-anchor="middle">really cost you?</text>

  <!-- the cold email that went out -->
  <g transform="translate(240,420)">
    <rect x="0" y="0" width="460" height="300" rx="26" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" filter="url(#shadow)"/>
    <rect x="30" y="30" width="200" height="40" rx="20" fill="#dbeafe"/>
    <text x="130" y="57" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="middle">Your cold email</text>
    <rect x="30" y="104" width="380" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="30" y="136" width="330" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="30" y="168" width="360" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="30" y="200" width="240" height="14" rx="7" fill="#e2e8f0"/>
  </g>

  <!-- the reply that came back -->
  <g transform="translate(760,470)">
    <rect x="0" y="0" width="420" height="190" rx="26" fill="#2563eb" filter="url(#shadow)"/>
    <text x="36" y="62" font-size="22" font-weight="600" fill="#bfdbfe">Positive reply</text>
    <text x="36" y="112" font-size="32" font-weight="700" fill="#ffffff">"Sounds interesting,</text>
    <text x="36" y="152" font-size="32" font-weight="700" fill="#ffffff">let's talk."</text>
  </g>

  <!-- the price tag hanging on the reply -->
  <g transform="translate(1270,440)">
    <circle cx="20" cy="20" r="9" fill="none" stroke="#1d4ed8" stroke-width="4"/>
    <path d="M20 29 L20 60" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
    <rect x="-60" y="60" width="160" height="84" rx="18" fill="#ffffff" stroke="#1d4ed8" stroke-width="3" filter="url(#shadow)"/>
    <text x="20" y="116" font-size="44" font-weight="800" fill="#0f172a" text-anchor="middle">$ ?</text>
  </g>

  <path d="M712 570 l36 0 m-12 -12 l12 12 l-12 12" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
