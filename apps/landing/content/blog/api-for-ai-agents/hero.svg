<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- SAFE ZONE: every word sits inside x 200..1400 (the central 4:3 of the 16:9 canvas). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1e3a8a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1380" cy="140" r="380" fill="url(#glow)"/>
  <circle cx="200" cy="800" r="300" fill="url(#glow)"/>

  <text x="800" y="150" font-size="24" letter-spacing="3" fill="#2563eb" font-weight="600" text-anchor="middle">API FOR AI AGENTS</text>
  <text x="800" y="240" font-size="76" font-weight="800" fill="#0f172a" text-anchor="middle">No human needed</text>
  <text x="800" y="300" font-size="30" fill="#475569" text-anchor="middle">Your agent signs up, gets its key and pays</text>

  <!-- three steps -->
  <g filter="url(#shadow)">
    <rect x="230" y="390" width="320" height="300" rx="28" fill="#ffffff"/>
    <rect x="640" y="390" width="320" height="300" rx="28" fill="#ffffff"/>
    <rect x="1050" y="390" width="320" height="300" rx="28" fill="#ffffff"/>
  </g>

  <!-- step 1: email code -->
  <rect x="320" y="440" width="140" height="96" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="5"/>
  <path d="M322 446 L390 498 L458 446" fill="none" stroke="#2563eb" stroke-width="5" stroke-linejoin="round"/>
  <text x="390" y="600" font-size="34" font-weight="700" fill="#0f172a" text-anchor="middle">Email code</text>
  <text x="390" y="648" font-size="30" font-weight="600" fill="#2563eb" text-anchor="middle" letter-spacing="6">482 913</text>

  <!-- arrow -->
  <path d="M566 540 L622 540" stroke="#93c5fd" stroke-width="6" stroke-linecap="round"/>
  <path d="M608 526 L624 540 L608 554" fill="none" stroke="#93c5fd" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- step 2: api key -->
  <circle cx="760" cy="488" r="38" fill="#eff6ff" stroke="#2563eb" stroke-width="6"/>
  <circle cx="760" cy="488" r="12" fill="#2563eb"/>
  <path d="M798 488 L872 488 M846 488 L846 514 M866 488 L866 506" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <text x="800" y="600" font-size="34" font-weight="700" fill="#0f172a" text-anchor="middle">API key</text>
  <text x="800" y="648" font-size="26" fill="#64748b" text-anchor="middle" font-family="Menlo, Consolas, monospace">distrib.usr_...</text>

  <!-- arrow -->
  <path d="M976 540 L1032 540" stroke="#93c5fd" stroke-width="6" stroke-linecap="round"/>
  <path d="M1018 526 L1034 540 L1018 554" fill="none" stroke="#93c5fd" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- step 3: prepay -->
  <rect x="1140" y="444" width="140" height="92" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="5"/>
  <rect x="1140" y="464" width="140" height="18" fill="#2563eb"/>
  <rect x="1160" y="504" width="50" height="10" rx="5" fill="#93c5fd"/>
  <text x="1210" y="600" font-size="34" font-weight="700" fill="#0f172a" text-anchor="middle">Prepay</text>
  <text x="1210" y="648" font-size="30" font-weight="600" fill="#2563eb" text-anchor="middle">from $10</text>

  <text x="800" y="790" font-size="28" fill="#475569" text-anchor="middle">Free calls work at once. No free credit, no trial.</text>
</svg>
