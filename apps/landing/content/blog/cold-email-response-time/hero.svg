<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- SAFE ZONE: every word sits inside x 200..1400 (the central 4:3 of the 16:9 canvas). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1e3a8a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1380" cy="140" r="380" fill="url(#glow)"/>
  <circle cx="200" cy="800" r="300" fill="url(#glow)"/>

  <text x="800" y="150" font-size="24" letter-spacing="3" fill="#2563eb" font-weight="600" text-anchor="middle">COLD EMAIL DATA</text>
  <text x="800" y="238" font-size="68" font-weight="800" fill="#0f172a" text-anchor="middle">When do the yeses</text>
  <text x="800" y="316" font-size="68" font-weight="800" fill="#0f172a" text-anchor="middle">come in?</text>

  <!-- one card: a timeline with three waves of replies -->
  <g transform="translate(220,390)" filter="url(#shadow)">
    <rect x="0" y="0" width="1160" height="380" rx="28" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  </g>
  <g transform="translate(220,390)">
    <!-- baseline -->
    <line x1="60" y1="290" x2="1100" y2="290" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <!-- wave 1: same day, the tallest -->
    <path d="M70 290 C120 290 130 70 190 70 C250 70 260 290 320 290 Z" fill="url(#wave)"/>
    <!-- wave 2: after the day-3 follow-up -->
    <path d="M400 290 C440 290 455 200 500 200 C545 200 560 290 600 290 Z" fill="url(#wave)" opacity="0.8"/>
    <!-- wave 3: after the day-10 follow-up -->
    <path d="M720 290 C770 290 790 140 850 140 C910 140 930 290 980 290 Z" fill="url(#wave)" opacity="0.9"/>
    <!-- email markers -->
    <g>
      <rect x="140" y="306" width="100" height="40" rx="20" fill="#dbeafe"/>
      <text x="190" y="333" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="middle">Day 1</text>
      <rect x="450" y="306" width="100" height="40" rx="20" fill="#dbeafe"/>
      <text x="500" y="333" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="middle">Day 3</text>
      <rect x="795" y="306" width="110" height="40" rx="20" fill="#dbeafe"/>
      <text x="850" y="333" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="middle">Day 10</text>
    </g>
    <text x="190" y="52" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle">Same day</text>
    <text x="500" y="182" font-size="22" font-weight="600" fill="#0f172a" text-anchor="middle">Follow-up 1</text>
    <text x="850" y="122" font-size="22" font-weight="600" fill="#0f172a" text-anchor="middle">Follow-up 2</text>
    <!-- a reply bubble -->
    <g transform="translate(1000,60)">
      <rect x="0" y="0" width="120" height="70" rx="20" fill="#2563eb"/>
      <path d="M24 70 l0 22 l22 -22 Z" fill="#2563eb"/>
      <text x="60" y="45" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">Yes!</text>
    </g>
  </g>
</svg>
