<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!--
    SAFE ZONE: every word and every figure sits inside x 200..1400 (the central
    4:3 of a 16:9 canvas). The blog list crops the featured cover to whatever
    height its text column needs (about 3:2 on desktop) and the article page
    crops to 16:9; both keep the centre and lose the sides. Outside the safe
    zone there is only background.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1e3a8a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1380" cy="140" r="380" fill="url(#glow)"/>
  <circle cx="200" cy="800" r="300" fill="url(#glow)"/>

  <!-- title block, centred -->
  <text x="800" y="150" font-size="24" letter-spacing="3" fill="#2563eb" font-weight="600" text-anchor="middle">COLD EMAIL ECONOMICS</text>
  <text x="800" y="240" font-size="72" font-weight="800" fill="#0f172a" text-anchor="middle">What does a click cost?</text>
  <text x="800" y="300" font-size="28" fill="#475569" text-anchor="middle">120,000 emails sent. One price, and ten things that move it.</text>

  <!-- left: an envelope with a link, a cursor, the price -->
  <g transform="translate(210,380)">
    <rect x="0" y="0" width="570" height="330" rx="28" fill="#ffffff" stroke="#bfdbfe" filter="url(#shadow)"/>
    <rect x="48" y="70" width="230" height="150" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M48 84 L163 170 L278 84" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="80" y="180" width="110" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="80" y="198" width="150" height="10" rx="5" fill="#2563eb"/>
    <path d="M236 206 L236 256 L249 244 L258 265 L268 261 L259 240 L277 240 Z" fill="#0f172a" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
    <text x="330" y="150" font-size="88" font-weight="800" fill="#0f172a">$11</text>
    <text x="330" y="190" font-size="20" fill="#64748b">per click, on average</text>
    <text x="330" y="222" font-size="18" fill="#2563eb" font-weight="600">6 clicks per 1,000 emails</text>
  </g>

  <!-- right: the spread, one dot per client -->
  <g transform="translate(820,380)">
    <rect x="0" y="0" width="570" height="330" rx="28" fill="#0f172a" filter="url(#shadow)"/>
    <text x="40" y="60" font-size="20" letter-spacing="2" fill="#93c5fd" font-weight="700">ONE DOT PER CLIENT</text>
    <line x1="40" y1="190" x2="530" y2="190" stroke="#334155" stroke-width="3"/>
    <text x="40" y="240" font-size="18" fill="#94a3b8">$1</text>
    <text x="530" y="240" font-size="18" fill="#94a3b8" text-anchor="end">$45</text>
    <circle cx="48" cy="190" r="11" fill="#93c5fd"/>
    <circle cx="62" cy="168" r="11" fill="#93c5fd"/>
    <circle cx="74" cy="190" r="11" fill="#93c5fd"/>
    <circle cx="80" cy="212" r="11" fill="#93c5fd"/>
    <circle cx="86" cy="146" r="11" fill="#93c5fd"/>
    <circle cx="100" cy="190" r="11" fill="#93c5fd"/>
    <circle cx="106" cy="168" r="11" fill="#93c5fd"/>
    <circle cx="150" cy="190" r="11" fill="#93c5fd"/>
    <circle cx="188" cy="190" r="11" fill="#93c5fd"/>
    <circle cx="232" cy="190" r="11" fill="#93c5fd"/>
    <circle cx="520" cy="190" r="11" fill="#93c5fd"/>
    <line x1="112" y1="110" x2="112" y2="150" stroke="#ffffff" stroke-width="3" stroke-dasharray="6 5"/>
    <text x="112" y="100" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">median $7</text>
    <text x="40" y="292" font-size="17" fill="#cbd5e1">Half of our clients pay between $4 and $13.</text>
  </g>

  <!-- brand, inside the safe zone -->
  <circle cx="800" cy="790" r="9" fill="#2563eb"/>
  <text x="782" y="797" font-size="22" font-weight="700" fill="#0f172a" text-anchor="end">distribute.you</text>
</svg>
