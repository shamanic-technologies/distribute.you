<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!--
    SAFE ZONE: every word and every shape sits inside x 200..1400 (the central
    4:3 of a 16:9 canvas); the blog list and the article page crop the sides.
    The row of shapes is the video's one morphing element, frozen at four states.
  -->
  <defs>
    <filter id="shadow" x="-50%" y="-60%" width="200%" height="260%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#ECEAE6"/>

  <text x="800" y="150" font-size="24" letter-spacing="3" fill="#2563eb" font-weight="600" text-anchor="middle">MOTION DESIGN IN CODE</text>
  <text x="800" y="240" font-size="76" font-weight="800" fill="#0a0a0a" text-anchor="middle">One prompt. One promo video.</text>
  <text x="800" y="300" font-size="30" fill="#6f6c67" text-anchor="middle">No After Effects. Every frame is computed from time.</text>

  <!-- state 1: button -->
  <g filter="url(#shadow)">
    <rect x="215" y="510" width="230" height="72" rx="36" fill="#0a0a0a"/>
  </g>
  <text x="330" y="556" font-size="28" font-weight="600" fill="#ffffff" text-anchor="middle">Start free →</text>

  <!-- arrow -->
  <path d="M470 546 H520" stroke="#b8b5af" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9"/>

  <!-- state 2: check -->
  <g filter="url(#shadow)">
    <circle cx="590" cy="546" r="52" fill="#2563eb"/>
  </g>
  <path d="M566 546 l17 17 l32 -34" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M660 546 H710" stroke="#b8b5af" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9"/>

  <!-- state 3: activity card -->
  <g filter="url(#shadow)">
    <rect x="735" y="420" width="330" height="252" rx="30" fill="#ffffff"/>
  </g>
  <rect x="760" y="446" width="90" height="62" rx="14" fill="#f6f5f2"/>
  <rect x="860" y="446" width="90" height="62" rx="14" fill="#e3ebfd"/>
  <rect x="960" y="446" width="80" height="62" rx="14" fill="#f6f5f2"/>
  <text x="776" y="490" font-size="28" font-weight="700" fill="#0a0a0a">28</text>
  <text x="876" y="490" font-size="28" font-weight="700" fill="#2563eb">9</text>
  <text x="976" y="490" font-size="28" font-weight="700" fill="#0a0a0a">4</text>
  <g font-size="17">
    <circle cx="776" cy="542" r="12" fill="#2563eb"/><rect x="798" y="533" width="160" height="10" rx="5" fill="#1f1f1f"/><rect x="798" y="549" width="110" height="8" rx="4" fill="#cfccc6"/>
    <circle cx="776" cy="590" r="12" fill="#0a0a0a"/><rect x="798" y="581" width="140" height="10" rx="5" fill="#1f1f1f"/><rect x="798" y="597" width="130" height="8" rx="4" fill="#cfccc6"/>
    <circle cx="776" cy="638" r="12" fill="#e4e2de"/><rect x="798" y="629" width="170" height="10" rx="5" fill="#1f1f1f"/><rect x="798" y="645" width="90" height="8" rx="4" fill="#cfccc6"/>
  </g>

  <path d="M1090 546 H1140" stroke="#b8b5af" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9"/>

  <!-- state 4: call card with waveform -->
  <g filter="url(#shadow)">
    <rect x="1165" y="400" width="220" height="292" rx="40" fill="#0a0a0a"/>
  </g>
  <rect x="1245" y="428" width="60" height="60" rx="16" fill="#2563eb"/>
  <g fill="#ffffff">
    <rect x="1203" y="560" width="6" height="10" rx="3"/><rect x="1215" y="552" width="6" height="26" rx="3"/>
    <rect x="1227" y="544" width="6" height="42" rx="3"/><rect x="1239" y="536" width="6" height="58" rx="3"/>
    <rect x="1251" y="548" width="6" height="34" rx="3"/><rect x="1263" y="532" width="6" height="66" rx="3"/>
    <rect x="1275" y="542" width="6" height="46" rx="3"/><rect x="1287" y="538" width="6" height="54" rx="3"/>
    <rect x="1299" y="550" width="6" height="30" rx="3"/><rect x="1311" y="544" width="6" height="42" rx="3"/>
    <rect x="1323" y="554" width="6" height="22" rx="3"/><rect x="1335" y="560" width="6" height="10" rx="3"/>
  </g>
  <rect x="1215" y="630" width="120" height="30" rx="15" fill="#2563eb"/>
  <text x="1275" y="651" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">0:42</text>

  <text x="800" y="790" font-size="26" fill="#6f6c67" text-anchor="middle">The prompt, the render pipeline, and the video it made.</text>
</svg>
