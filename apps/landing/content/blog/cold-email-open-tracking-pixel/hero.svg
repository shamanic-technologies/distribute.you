<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- SAFE ZONE: every word sits inside x 200..1400 (the central 4:3 of the 16:9 canvas). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1e3a8a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1380" cy="140" r="380" fill="url(#glow)"/>
  <circle cx="200" cy="800" r="300" fill="url(#glow)"/>

  <text x="800" y="150" font-size="24" letter-spacing="3" fill="#2563eb" font-weight="600" text-anchor="middle">COLD EMAIL DATA</text>
  <text x="800" y="238" font-size="68" font-weight="800" fill="#0f172a" text-anchor="middle">Is your open tracking</text>
  <text x="800" y="316" font-size="68" font-weight="800" fill="#0f172a" text-anchor="middle">costing you replies?</text>

  <!-- left: an email carrying the hidden pixel -->
  <g transform="translate(230,400)">
    <rect x="0" y="0" width="540" height="360" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
    <rect x="36" y="36" width="190" height="40" rx="20" fill="#f1f5f9"/>
    <text x="131" y="63" font-size="20" font-weight="700" fill="#475569" text-anchor="middle">Tracking on</text>
    <rect x="36" y="110" width="440" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="36" y="142" width="400" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="36" y="174" width="420" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="36" y="206" width="260" height="14" rx="7" fill="#e2e8f0"/>
    <!-- the pixel, magnified -->
    <rect x="330" y="200" width="26" height="26" fill="#dc2626"/>
    <circle cx="343" cy="213" r="46" fill="none" stroke="#dc2626" stroke-width="4"/>
    <line x1="376" y1="246" x2="420" y2="290" stroke="#dc2626" stroke-width="8" stroke-linecap="round"/>
    <text x="36" y="310" font-size="24" fill="#64748b">Fewer replies</text>
  </g>

  <!-- right: the same email, no pixel -->
  <g transform="translate(830,400)">
    <rect x="0" y="0" width="540" height="360" rx="28" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" filter="url(#shadow)"/>
    <rect x="36" y="36" width="190" height="40" rx="20" fill="#dbeafe"/>
    <text x="131" y="63" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="middle">Tracking off</text>
    <rect x="36" y="110" width="440" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="36" y="142" width="400" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="36" y="174" width="420" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="36" y="206" width="260" height="14" rx="7" fill="#e2e8f0"/>
    <text x="36" y="310" font-size="24" font-weight="600" fill="#1d4ed8">More replies</text>
    <circle cx="470" cy="302" r="22" fill="#2563eb"/>
    <path d="M459 302 l8 8 l15 -16" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
