<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- SAFE ZONE: every word sits inside x 200..1400 (the central 4:3 of the 16:9 canvas). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1e3a8a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1380" cy="140" r="380" fill="url(#glow)"/>
  <circle cx="200" cy="800" r="300" fill="url(#glow)"/>
  <text x="800" y="150" font-size="24" letter-spacing="3" fill="#2563eb" font-weight="600" text-anchor="middle">COLD EMAIL AGENCY PRICING</text>
  <text x="800" y="238" font-size="68" font-weight="800" fill="#0f172a" text-anchor="middle">What are you</text>
  <text x="800" y="316" font-size="68" font-weight="800" fill="#0f172a" text-anchor="middle">actually paying for?</text>
  <g transform="translate(260,400)" filter="url(#shadow)">
    <rect x="0" y="0" width="240" height="320" rx="24" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="120" y="70" font-size="24" font-weight="700" fill="#64748b" text-anchor="middle">Retainer</text>
    <text x="120" y="160" font-size="48" font-weight="800" fill="#0f172a" text-anchor="middle">Time</text>
    <text x="120" y="250" font-size="22" fill="#64748b" text-anchor="middle">Risk: you</text>
  </g>
  <g transform="translate(540,400)" filter="url(#shadow)">
    <rect x="0" y="0" width="240" height="320" rx="24" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="120" y="70" font-size="24" font-weight="700" fill="#64748b" text-anchor="middle">Per meeting</text>
    <text x="120" y="160" font-size="48" font-weight="800" fill="#0f172a" text-anchor="middle">Slots</text>
    <text x="120" y="250" font-size="22" fill="#64748b" text-anchor="middle">Risk: agency</text>
  </g>
  <g transform="translate(820,400)" filter="url(#shadow)">
    <rect x="0" y="0" width="240" height="320" rx="24" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="120" y="70" font-size="24" font-weight="700" fill="#64748b" text-anchor="middle">Per contact</text>
    <text x="120" y="160" font-size="48" font-weight="800" fill="#0f172a" text-anchor="middle">Reach</text>
    <text x="120" y="250" font-size="22" fill="#64748b" text-anchor="middle">Risk: shared</text>
  </g>
  <g transform="translate(1100,400)" filter="url(#shadow)">
    <rect x="0" y="0" width="240" height="320" rx="24" fill="#2563eb"/>
    <text x="120" y="70" font-size="24" font-weight="700" fill="#dbeafe" text-anchor="middle">Budget</text>
    <text x="120" y="160" font-size="48" font-weight="800" fill="#ffffff" text-anchor="middle">Spend</text>
    <text x="120" y="250" font-size="22" fill="#dbeafe" text-anchor="middle">Risk: shared</text>
  </g>
</svg>
