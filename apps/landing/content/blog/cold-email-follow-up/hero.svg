<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- SAFE ZONE: every word sits inside x 200..1400 (the central 4:3 of the 16:9 canvas). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1e3a8a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1380" cy="140" r="380" fill="url(#glow)"/>
  <circle cx="200" cy="800" r="300" fill="url(#glow)"/>

  <text x="800" y="150" font-size="24" letter-spacing="3" fill="#2563eb" font-weight="600" text-anchor="middle">COLD EMAIL DATA</text>
  <text x="800" y="238" font-size="68" font-weight="800" fill="#0f172a" text-anchor="middle">How many times should</text>
  <text x="800" y="316" font-size="68" font-weight="800" fill="#0f172a" text-anchor="middle">you follow up?</text>

  <!-- three emails of one sequence, each a little further down the thread -->
  <g transform="translate(220,420)">
    <rect x="0" y="0" width="360" height="300" rx="26" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" filter="url(#shadow)"/>
    <rect x="30" y="30" width="190" height="40" rx="20" fill="#dbeafe"/>
    <text x="125" y="57" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="middle">First email</text>
    <rect x="30" y="104" width="290" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="30" y="136" width="250" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="30" y="168" width="200" height="14" rx="7" fill="#e2e8f0"/>
    <text x="30" y="256" font-size="24" font-weight="600" fill="#1d4ed8">Day 1</text>
  </g>
  <g transform="translate(620,420)">
    <rect x="0" y="0" width="360" height="300" rx="26" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" filter="url(#shadow)"/>
    <rect x="30" y="30" width="190" height="40" rx="20" fill="#dbeafe"/>
    <text x="125" y="57" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="middle">Follow-up 1</text>
    <rect x="30" y="104" width="250" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="30" y="136" width="180" height="14" rx="7" fill="#e2e8f0"/>
    <text x="30" y="256" font-size="24" font-weight="600" fill="#1d4ed8">A few days later</text>
  </g>
  <g transform="translate(1020,420)">
    <rect x="0" y="0" width="360" height="300" rx="26" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" filter="url(#shadow)"/>
    <rect x="30" y="30" width="190" height="40" rx="20" fill="#dbeafe"/>
    <text x="125" y="57" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="middle">Follow-up 2</text>
    <rect x="30" y="104" width="200" height="14" rx="7" fill="#e2e8f0"/>
    <text x="30" y="256" font-size="24" font-weight="600" fill="#1d4ed8">Still worth it?</text>
    <circle cx="306" cy="248" r="24" fill="#2563eb"/>
    <text x="306" y="257" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">?</text>
  </g>
  <!-- arrows between the emails -->
  <path d="M588 570 l24 0 m-10 -10 l10 10 l-10 10" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M988 570 l24 0 m-10 -10 l10 10 l-10 10" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
