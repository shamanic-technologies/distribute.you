<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- SAFE ZONE: every word sits inside x 200..1400 (the central 4:3 of the 16:9 canvas). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1e3a8a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1380" cy="140" r="380" fill="url(#glow)"/>
  <circle cx="200" cy="800" r="300" fill="url(#glow)"/>

  <text x="800" y="150" font-size="24" letter-spacing="3" fill="#2563eb" font-weight="600" text-anchor="middle">COLD EMAIL DATA</text>
  <text x="800" y="238" font-size="68" font-weight="800" fill="#0f172a" text-anchor="middle">Which LLM should write</text>
  <text x="800" y="316" font-size="68" font-weight="800" fill="#0f172a" text-anchor="middle">your cold emails?</text>

  <!-- left: the cheap model -->
  <g transform="translate(230,400)">
    <rect x="0" y="0" width="540" height="360" rx="28" fill="#ffffff" stroke="#2563eb" stroke-width="3" filter="url(#shadow)"/>
    <rect x="36" y="36" width="150" height="40" rx="20" fill="#dbeafe"/>
    <text x="111" y="63" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="middle">Flash</text>
    <text x="504" y="66" font-size="34" font-weight="800" fill="#2563eb" text-anchor="end">$</text>
    <rect x="36" y="118" width="420" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="36" y="150" width="360" height="14" rx="7" fill="#e2e8f0"/>
    <text x="36" y="214" font-size="22" fill="#2563eb" text-decoration="underline">see how it works</text>
    <path d="M150 204 l0 34 l9 -8 l7 15 l7 -3 l-7 -15 l12 -1 z" fill="#0f172a"/>
    <text x="36" y="316" font-size="26" font-weight="700" fill="#1d4ed8">Same clicks, half the cost</text>
  </g>

  <!-- right: the expensive model -->
  <g transform="translate(830,400)">
    <rect x="0" y="0" width="540" height="360" rx="28" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" filter="url(#shadow)"/>
    <rect x="36" y="36" width="150" height="40" rx="20" fill="#f1f5f9"/>
    <text x="111" y="63" font-size="20" font-weight="700" fill="#475569" text-anchor="middle">Pro</text>
    <text x="504" y="66" font-size="34" font-weight="800" fill="#94a3b8" text-anchor="end">$$</text>
    <rect x="36" y="118" width="420" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="36" y="150" width="360" height="14" rx="7" fill="#e2e8f0"/>
    <text x="36" y="214" font-size="22" fill="#2563eb" text-decoration="underline">see how it works</text>
    <path d="M150 204 l0 34 l9 -8 l7 15 l7 -3 l-7 -15 l12 -1 z" fill="#0f172a"/>
    <text x="36" y="316" font-size="26" font-weight="700" fill="#475569">Same clicks, full price</text>
  </g>
</svg>
