<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- SAFE ZONE: every word sits inside x 200..1400 (the central 4:3 of the 16:9 canvas). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1e3a8a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1380" cy="140" r="380" fill="url(#glow)"/>
  <circle cx="200" cy="800" r="300" fill="url(#glow)"/>

  <text x="800" y="150" font-size="24" letter-spacing="3" fill="#2563eb" font-weight="600" text-anchor="middle">COLD EMAIL DELIVERABILITY</text>
  <text x="800" y="238" font-size="68" font-weight="800" fill="#0f172a" text-anchor="middle">Is your unsubscribe link</text>
  <text x="800" y="316" font-size="68" font-weight="800" fill="#0f172a" text-anchor="middle">sending you to spam?</text>

  <!-- left: the old footer, filed in spam -->
  <g transform="translate(230,400)">
    <rect x="0" y="0" width="540" height="360" rx="28" fill="#ffffff" stroke="#fecaca" stroke-width="2" filter="url(#shadow)"/>
    <rect x="36" y="36" width="130" height="40" rx="20" fill="#fee2e2"/>
    <text x="101" y="63" font-size="20" font-weight="700" fill="#b91c1c" text-anchor="middle">Spam</text>
    <rect x="36" y="110" width="440" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="36" y="142" width="400" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="36" y="174" width="420" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="36" y="206" width="260" height="14" rx="7" fill="#e2e8f0"/>
    <line x1="36" y1="250" x2="504" y2="250" stroke="#f1f5f9" stroke-width="2"/>
    <text x="36" y="298" font-size="24" fill="#64748b">Don't want these?</text>
    <text x="252" y="298" font-size="24" font-weight="600" fill="#dc2626" text-decoration="underline">unsubscribe</text>
    <path d="M395 300 l14 36 l6 -14 l14 -6 z" fill="#0f172a"/>
  </g>

  <!-- right: the new footer, in the inbox -->
  <g transform="translate(830,400)">
    <rect x="0" y="0" width="540" height="360" rx="28" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" filter="url(#shadow)"/>
    <rect x="36" y="36" width="130" height="40" rx="20" fill="#dbeafe"/>
    <text x="101" y="63" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="middle">Inbox</text>
    <rect x="36" y="110" width="440" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="36" y="142" width="400" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="36" y="174" width="420" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="36" y="206" width="260" height="14" rx="7" fill="#e2e8f0"/>
    <line x1="36" y1="250" x2="504" y2="250" stroke="#f1f5f9" stroke-width="2"/>
    <text x="36" y="298" font-size="24" fill="#334155">Not relevant? Reply "stop".</text>
    <circle cx="470" cy="290" r="22" fill="#2563eb"/>
    <path d="M459 290 l8 8 l15 -16" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
